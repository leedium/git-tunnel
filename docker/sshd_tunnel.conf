# Template. docker/entrypoint.sh fills in the __PLACEHOLDERS__ and installs the
# result as /etc/ssh/sshd_config.d/00-git-tunnel.conf. The first value sshd
# reads for an option wins, so this file overrides the distribution defaults.

Port __SSH_PORT__
HostKey /state/hostkeys/ssh_host_ed25519_key

# Login: only sshuser, with the password from .env. A public key placed in
# ~/.ssh/authorized_keys also works.
AllowUsers sshuser
PermitRootLogin no
PasswordAuthentication yes
KbdInteractiveAuthentication no
PubkeyAuthentication yes
MaxAuthTries 3

# Forwarding: the client may open only the reverse ports listed here (the git
# tunnel port, plus the SOCKS port when the HTTP proxy is enabled). They are
# bound to the container's loopback only. Nothing else on the network can use
# them.
AllowTcpForwarding remote
GatewayPorts no
PermitListen __PERMIT_LISTEN__
AllowAgentForwarding no
AllowStreamLocalForwarding no
X11Forwarding no
PermitTunnel no
